# Sample GitHub Actions workflow: publish a grc.store catalog with grcli.
#
# Trusted publishing (ADR-0032) — no stored secret. The workflow's GitHub
# OIDC token is the credential: the hub validates it directly and maps this
# repository to the target namespace via a trusted-publisher binding.
#
# Prerequisite (one-time, by an org admin on the hub): add this repository
# (owner/repo) as a Trusted CI publisher for the namespace, optionally
# pinned to a single git ref. Without that binding the hub returns 403.
#
# Copy this into .github/workflows/ in your catalog repo and adjust the
# file path, the --url, and the trigger to taste.

name: Publish catalog

on:
  push:
    branches: [main]
    paths: ['controls.yaml']      # publish only when the catalog changes
  workflow_dispatch: {}            # allow manual runs

permissions:
  contents: read
  id-token: write                  # issue the workflow OIDC token
                                   # (hub auth + cosign keyless signing)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fetch the pre-built grcli binary from the public GHCR artifact.
      # No token needed (the package is public). Pin to a released tag.
      - uses: oras-project/setup-oras@v1
      - name: Install grcli
        run: |
          oras pull ghcr.io/revanite-io/grcli:v0.1.0 --platform linux/amd64
          sudo install grcli /usr/local/bin/grcli

      # Required for keyless signing; the publish step signs the bundle
      # with the same workflow OIDC identity that authorizes the push.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Publish
        run: grcli publish -f controls.yaml --url https://hub.grc.store
